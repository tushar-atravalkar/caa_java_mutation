name: Test and Mutation Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Download SonarQube Scanner
        run: |
          mkdir -p ~/.sonar
          cd ~/.sonar
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip
          unzip -q sonar-scanner.zip
          rm sonar-scanner.zip
          echo "$HOME/.sonar/sonar-scanner-6.1.0.4477-linux-x64/bin" >> "$GITHUB_PATH"

      # Mutates the code this PR changed, writes .sonar/mutation-report.json,
      # then runs the Sonar scan itself (the plugin reads that report).
      - name: Mutation testing and Sonar upload
        id: mutation
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .claude/skills/run-mutation-workflow/scripts/run.py \
            --skip-engine-check \
            --base origin/${{ github.base_ref || 'main' }} \
            --threshold 80 \
            --sonar-pr "${{ github.event.pull_request.number }}" \
            --sonar-pr-branch "${{ github.head_ref }}" \
            --sonar-pr-base "${{ github.base_ref }}"

      - name: Enforce mutation gate
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "Mutation step failed: score below the threshold or the Sonar upload failed (see the step above)."
          exit 1
