name: Test and Mutation Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Run mutation testing and build Sonar report
        id: mutation
        continue-on-error: true
        run: |
          python3 .claude/skills/run-mutation-workflow/scripts/run.py \
            --skip-sonar --skip-engine-check \
            --base origin/${{ github.base_ref || 'main' }} \
            --threshold 80

      - name: Download SonarQube Scanner
        run: |
          mkdir -p ~/.sonar
          cd ~/.sonar
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip
          unzip -q sonar-scanner.zip
          rm sonar-scanner.zip

      - name: SonarQube Scan
        if: always()
        run: |
          ~/.sonar/sonar-scanner-6.1.0.4477-linux-x64/bin/sonar-scanner \
            -Dsonar.projectBaseDir=. \
            -Dsonar.host.url=https://sonartest.nice.com \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Enforce mutation gate
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "Mutation score is below the threshold (see the mutation step above)."
          exit 1
